<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add a Photo to The Wongs' Calendar 📸</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      text-align: center;
    }
    .emoji { font-size: 48px; margin-bottom: 12px; }
    h1 {
      font-size: 1.6rem;
      color: #1a1a2e;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .drop-zone {
      border: 2.5px dashed #c4b5fd;
      border-radius: 14px;
      padding: 36px 20px;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafafa;
      margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #764ba2;
      background: #f3eeff;
    }
    .drop-zone .icon { font-size: 36px; margin-bottom: 10px; }
    .drop-zone p { color: #555; font-size: 0.95rem; }
    .drop-zone .hint { color: #999; font-size: 0.82rem; margin-top: 6px; }
    #fileInput { display: none; }
    /* Thumbnail grid */
    .thumb-section { display: none; margin-bottom: 20px; }
    .thumb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .thumb-count {
      font-size: 0.88rem;
      color: #555;
      font-weight: 600;
    }
    .add-more-btn {
      font-size: 0.82rem;
      color: #764ba2;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
    }
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .thumb-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: #f0f0f0;
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      background: rgba(0,0,0,0.55);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 12px;
      line-height: 20px;
      text-align: center;
      padding: 0;
    }
    .thumb-remove:hover { background: rgba(200,0,0,0.8); }
    .batch-info {
      font-size: 0.78rem;
      color: #999;
      margin-bottom: 14px;
    }
    .batch-info span { color: #764ba2; font-weight: 600; }
    /* Send button */
    .send-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .send-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    /* Progress bar */
    .progress-wrap {
      display: none;
      margin-top: 16px;
    }
    .progress-label {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 8px;
    }
    .progress-bar-bg {
      background: #e9e9f0;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }
    /* Status */
    .status {
      margin-top: 18px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.93rem;
      display: none;
    }
    .status.success { background: #d1fae5; color: #065f46; display: block; }
    .status.error   { background: #fee2e2; color: #991b1b; display: block; }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer {
      margin-top: 24px;
      font-size: 0.78rem;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🖼️</div>
    <h1>Add Your Memz!</h1>
    <p class="subtitle">Upload a photo/video and it'll appear on their Skylight frame!</p>
    <div class="drop-zone" id="dropZone">
      <div class="icon">📷</div>
      <p>Click to choose photos/video</p>
      <p class="hint">or drag &amp; drop here · JPG, PNG, HEIC · multiple OK</p>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple />
    <div class="thumb-section" id="thumbSection">
      <div class="thumb-header">
        <span class="thumb-count" id="thumbCount"></span>
        <button class="add-more-btn" id="addMoreBtn">+ Add more</button>
      </div>
      <div class="thumb-grid" id="thumbGrid"></div>
      <p class="batch-info" id="batchInfo"></p>
    </div>
    <button class="send-btn" id="sendBtn" disabled>Send to Frame</button>
    <div class="progress-wrap" id="progressWrap">
      <p class="progress-label" id="progressLabel"></p>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="status" id="status"></div>
    <p class="footer">Photos are sent directly to Lucy and Edward's Skylight frame ✨</p>
  </div>
  <script>
    // ─── CONFIGURATION ──────────────────────────────────────────────────────────
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3_w0nuDeC_nZoMGC-SNy2MzFCJ590IWChtxtMAHmW408pC9hcxhmckSjEYnOPKwqoNg/exec";
    const MAX_BATCH_BYTES = 18 * 1024 * 1024; // 18 MB — safe under Gmail's 25 MB limit
    // ────────────────────────────────────────────────────────────────────────────
    const dropZone     = document.getElementById("dropZone");
    const fileInput    = document.getElementById("fileInput");
    const thumbSection = document.getElementById("thumbSection");
    const thumbCount   = document.getElementById("thumbCount");
    const addMoreBtn   = document.getElementById("addMoreBtn");
    const thumbGrid    = document.getElementById("thumbGrid");
    const batchInfo    = document.getElementById("batchInfo");
    const sendBtn      = document.getElementById("sendBtn");
    const progressWrap = document.getElementById("progressWrap");
    const progressLabel= document.getElementById("progressLabel");
    const progressFill = document.getElementById("progressFill");
    const statusEl     = document.getElementById("status");
    let selectedFiles = []; // array of File objects
    // ── File picking ──────────────────────────────────────────────────────────
    dropZone.addEventListener("click", () => fileInput.click());
    addMoreBtn.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
      addFiles(Array.from(e.dataTransfer.files));
    });
    fileInput.addEventListener("change", () => {
      addFiles(Array.from(fileInput.files));
      fileInput.value = ""; // reset so same file can be re-added after removal
    });
    function addFiles(files) {
      const images = files.filter(f => f.type.startsWith("image/"));
      if (images.length === 0) { showStatus("Please choose image files only.", "error"); return; }
      selectedFiles = selectedFiles.concat(images);
      hideStatus();
      renderThumbs();
    }
    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderThumbs();
      if (selectedFiles.length === 0) hideStatus();
    }
    // ── Thumbnail rendering ───────────────────────────────────────────────────
    function renderThumbs() {
      thumbGrid.innerHTML = "";
      selectedFiles.forEach((file, i) => {
        const item = document.createElement("div");
        item.className = "thumb-item";
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.onload = () => URL.revokeObjectURL(img.src);
        const btn = document.createElement("button");
        btn.className = "thumb-remove";
        btn.textContent = "✕";
        btn.title = "Remove";
        btn.addEventListener("click", () => removeFile(i));
        item.appendChild(img);
        item.appendChild(btn);
        thumbGrid.appendChild(item);
      });
      const count = selectedFiles.length;
      thumbCount.textContent = count + " photo" + (count !== 1 ? "s" : "") + " selected";
      const batches = createBatches(selectedFiles);
      if (batches.length > 1) {
        batchInfo.innerHTML =
          "These will be sent in <span>" + batches.length + " emails</span> to stay under Gmail's size limit.";
      } else {
        batchInfo.innerHTML = "";
      }
      thumbSection.style.display = count > 0 ? "block" : "none";
      dropZone.style.display     = count > 0 ? "none"  : "block";
      sendBtn.disabled           = count === 0;
    }
    // ── Batching ──────────────────────────────────────────────────────────────
    function createBatches(files) {
      const batches = [];
      let batch = [], batchSize = 0;
      for (const file of files) {
        if (batchSize + file.size > MAX_BATCH_BYTES && batch.length > 0) {
          batches.push(batch);
          batch = [file];
          batchSize = file.size;
        } else {
          batch.push(file);
          batchSize += file.size;
        }
      }
      if (batch.length > 0) batches.push(batch);
      return batches;
    }
    // ── Sending ───────────────────────────────────────────────────────────────
    sendBtn.addEventListener("click", async () => {
      if (selectedFiles.length === 0) return;
      const batches = createBatches(selectedFiles);
      sendBtn.disabled = true;
      sendBtn.innerHTML = '<span class="spinner"></span>Sending…';
      hideStatus();
      progressWrap.style.display = "block";
      setProgress(0, batches.length);
      try {
        for (let i = 0; i < batches.length; i++) {
          setProgress(i, batches.length);
          await sendBatch(batches[i]);
          setProgress(i + 1, batches.length);
        }
        const photoWord = selectedFiles.length === 1 ? "Photo" : "Photos";
        showStatus("🎉 " + photoWord + " sent! They'll show up on the frame soon.", "success");
        // Reset
        selectedFiles = [];
        thumbSection.style.display = "none";
        dropZone.style.display     = "block";
        sendBtn.disabled           = true;
        progressWrap.style.display = "none";
      } catch (err) {
        console.error(err);
        showStatus("Something went wrong — please check your connection and try again.", "error");
        progressWrap.style.display = "none";
        sendBtn.disabled = false;
      }
      sendBtn.innerHTML = "Send to Frame";
    });
    async function sendBatch(files) {
      const fileData = await Promise.all(files.map(async file => {
        const base64 = await toBase64(file);
        return {
          filename: file.name,
          content:  base64.split(",")[1],
          mimetype: file.type,
        };
      }));
      const response = await fetch(APPS_SCRIPT_URL, {
        method:   "POST",
        mode:     "cors",
        redirect: "follow",
        headers:  { "Content-Type": "text/plain" },
        body:     JSON.stringify({ files: fileData }),
      });
      if (!response.ok) throw new Error("Server returned " + response.status);
    }
    function setProgress(done, total) {
      const pct = total === 0 ? 100 : Math.round((done / total) * 100);
      progressFill.style.width = pct + "%";
      if (total <= 1) {
        progressLabel.textContent = "Sending…";
      } else {
        progressLabel.textContent = "Sending batch " + Math.min(done + 1, total) + " of " + total + "…";
        if (done === total) progressLabel.textContent = "All done!";
      }
    }
    // ── Helpers ───────────────────────────────────────────────────────────────
    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    function showStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className   = "status " + type;
    }
    function hideStatus() {
      statusEl.className = "status";
    }
  </script>
</body>
</html>
